<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>

    <mask id="m">
      <rect x="0" y="0" width="48" height="48" rx="12" fill="white"/>

      <!-- Spokes -->
      <line x1="24" y1="16" x2="24" y2="26" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="32" x2="24" y2="26" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="32" x2="24" y2="26" stroke="black" stroke-width="3" stroke-linecap="round"/>

      <!--
        All three outer nodes share the same edge margin (13 px):
          top:   cy=16, r=3  → 16-3=13 px from top
          left:  cx=16, r=3  → 16-3=13 px from left
          right: cx=32, r=3  → 48-32-3=13 px from right
          bot:   cy=32, r=3  → 48-32-3=13 px from bottom
      -->
      <circle cx="24" cy="16" r="3"   fill="black"/>
      <circle cx="16" cy="32" r="3"   fill="black"/>
      <circle cx="32" cy="32" r="3"   fill="black"/>

      <!-- Center hub at circumcenter of the outer-node triangle -->
      <circle cx="24" cy="26" r="4.5" fill="black"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#g)" mask="url(#m)"/>
</svg>
